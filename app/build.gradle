apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.2"

    defaultConfig {
        applicationId "com.slipkprojects.sockshttp"
		minSdkVersion 21
        targetSdkVersion 28
        versionCode 1
        versionName "1"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
	api 'com.android.support:cardview-v7:25.+'
    api 'com.android.support:appcompat-v7:25.+'
	api 'com.android.support:preference-v7:25.+'
	api 'com.android.support:design:25.+'
	api 'com.android.support.constraint:constraint-layout:1.0.2'
	api 'com.google.android.gms:play-services-ads-lite:11.8.0'
	api 'net.i2p.crypto:eddsa:0.3.0'
	api 'org.connectbot.jbcrypt:jbcrypt:1.0.0'
	api 'com.github.kimchangyoun:rootbeerFresh:+'
}
