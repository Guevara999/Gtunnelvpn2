name: Android CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # 1. Install JDK 17 for sdkmanager
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Now SDK setup runs with JDK 17 and will accept licenses
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true

    # 3. Switch back to JDK 11 for the Gradle build (your AGP 4.0.1 requires JDK 8/11)
    - name: Set up JDK 11 for Gradle
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build
